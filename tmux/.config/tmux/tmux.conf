# settings
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -ga terminal-features "xterm*:extkeys"
set -ga terminal-features "xterm-ghostty:extkeys"
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g detach-on-destroy off
set -g history-limit 50000
set -g set-clipboard on
set -g escape-time 0
set -g mouse on
set -g display-time 4000
set -g aggressive-resize on

# keybinds

bind -r ^ last-window
# Seamless nvim/tmux pane navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

bind -r m resize-pane -Z

set -g prefix C-a
bind-key C-a send-prefix

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind Enter split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

unbind r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message ".tmux.conf reloaded"

# pane resize
bind -r - resize-pane -D 5
bind -r = resize-pane -U 5
bind -r [ resize-pane -L 5
bind -r ] resize-pane -R 5
bind DC select-layout tiled

# kill pane without confirm
bind x kill-pane

# enable vi keys
setw -g mode-keys vi

# copy mode
bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi 'Escape' send -X clear-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

source ~/.config/tmux/catppuccin.conf
